<script id="dashboard-data" type="application/json">{"missionStatement":"The world already has enough. What it lacks is circulation.\n\nThis site exists to build a circulating system of distribution that rewards generosity \u2014 a place where people say what they need and what they have, and where those two things find each other. Not charity, which lifts a person only as far as *back on their feet*. Not barter, which keeps score between two parties and rewards whoever starts with more. A cycle: what goes around comes around by way of everyone.\n\nWhat is rewarded here is not what you lack but what you give \u2014 and not the size of the gift, but the steadiness of the giving. That puts rich and poor on the same field and points everyone the same direction: toward each other.\n\nWe build for a world where fewer people will ever hold a job again, and where meeting each other's needs can no longer wait on anyone first earning the right to have them met.\n\nHumans and bots share this space. The bots notice the overlaps a person alone would miss, cheer real generosity into the open, and help people cross from one way of thinking into another.\n\nNothing built here may harm anyone. That outranks everything else written above.","notes":[{"id":"n1787371850687p1hfh","text":"We are trying to make this as simple as possible. We need to keep each piece as simple as possible."},{"id":"n1787371920237vgnnu","text":"I want simplicity built in from the start, in both the appearance and the mechanics and the logistics. Everything needs to go by the KISS principle."},{"id":"n1787371982631vgsf5","text":"Each piece should first be planned out until it WORKS, then gone over again until it works SIMPLY, and is easily understandable. Then double-check it's effective at doing what its supposed to do, both implementing the feature, and moving towards the goals in Mission.md"},{"id":"n17873720502494wccg","text":"Put off the specifics of the 'authorization' using a PNG until much later. Create the whole platform with authorization in mind but not yet implemented."},{"id":"n1787372097939fah7w","text":"Some of the first things we need to plan is just how it will look and feel to use the website, what sections does it have, how can people interact or not interact. What roles exactly does the bots play, and how do they do them, how often, etc."}],"settings":[],"features":[{"id":"f4a9d8a93e6fd32","text":"Site shape: what sections exist, how people move between them, where gift notes live, and how bots take part \u2014 decided and written down before code.","done":false,"picked":false},{"id":"f94262618105cbb","text":"Project skeleton: server, database, and a single styled page that renders.","done":false,"picked":false},{"id":"fffcb7cf914f2eb","text":"Placeholder identity: signup hands out a random key the user copies; pasting it back logs them in. A plain stand-in for the PNG login, never called security.","done":false,"picked":false},{"id":"f0a54285033fd37","text":"Public feed: post, read, and reply in the open.","done":false,"picked":false},{"id":"f745400b4584848","text":"Gift notes: write a note (what's offered, how to reach you), see it, pass it on.","done":false,"picked":false},{"id":"fcc31067664bb58","text":"Note passing: pass a note openly or quietly; the author is notified when it's redeemed, nobody else.","done":false,"picked":false},{"id":"fb3414e3c3cdcf0","text":"Profiles: show what a person has offered and passed along; never show what they've received.","done":false,"picked":false},{"id":"f4053ccca260962","text":"Private messaging between people, and with bots.","done":false,"picked":false},{"id":"fad571b8995d782","text":"Blocking: hide a blocked person's posts, profile, and gift wall from you, and stop their private messages to you \u2014 a personal filter, silent, never a platform-wide score or punishment.","done":false,"picked":false},{"id":"f473c063a41508f","text":"Bot framework: personas with stable names, avatars, specialties, and small prompts.","done":false,"picked":false},{"id":"f27babc3c92b4c4","text":"Fact extraction: pull structured facts (city, offers, needs, channels used) from bot conversations into the database.","done":false,"picked":false},{"id":"f6ca91af9b6a1f5","text":"Overlap engine: plain database matching to find who has what someone else needs, and whether they're reachable to each other.","done":false,"picked":false},{"id":"f91cc62e48c05f7","text":"Coordinator bots: reach out with a concrete match and a concrete next step.","done":false,"picked":false},{"id":"f9051a7e18b0352","text":"Welcome bot: explain the 9-out-of-10 culture and why this isn't money or barter.","done":false,"picked":false},{"id":"f8c96635f3e47dc","text":"Offsite routing: help a giver post somewhere real and point the receiver at it.","done":false,"picked":false},{"id":"f34defc1ff0bd2f","text":"Privacy enforcement: bots read only bot conversations, and never repeat personal details between people.","done":false,"picked":false},{"id":"f9c373df68d54d3","text":"Doodle canvas: template with a dotted name line and a face square, a few colors, an eraser, and a clear button.","done":false,"picked":false},{"id":"fd4982525b51331","text":"ID export: render the canvas to a high-resolution PNG the user downloads.","done":false,"picked":false},{"id":"f62d13cf9912632","text":"Signup: claim a unique username, check the image hash is unique, then release the PNG.","done":false,"picked":false},{"id":"f783e76d075fcce","text":"Avatar derivation: crop the face square down to a small clean avatar and store it.","done":false,"picked":false},{"id":"f579a68ffdb19c9","text":"Login: upload the PNG, hash it, match it, start a session.","done":false,"picked":false}],"quickOptions":[{"id":"qo-close-siteshape","label":"Sign off on SiteShape.md and check off the Site Shape feature","detail":"SiteShape.md is written and everything in Task.md's To Do is done except your review. Toggling this checks off 'Site shape' in FeaturesList.md, moves Task.md into History, and clears Task.md for the next feature.","toggled":false},{"id":"qo-next-skeleton","label":"Next up: project skeleton","detail":"Once Site Shape is signed off, start 'Project skeleton: server, database, and a single styled page that renders' \u2014 using Flask + SQLite + server-rendered HTML unless you say otherwise.","toggled":false},{"id":"qo-next-identity","label":"Next up: placeholder identity instead","detail":"Once Site Shape is signed off, start 'Placeholder identity' (the copy-paste key stand-in login) before the skeleton, if you'd rather build login first.","toggled":false},{"id":"qo-moderation","label":"Decide whether the site needs real moderation, not just personal blocking","detail":"Blocking (just added to FeaturesList.md) only hides content from the person who blocked it \u2014 a slur is still visible to everyone else. There's no admin/moderator role or report mechanism anywhere in the design yet. Toggling this adds it to FeaturesList.md as a feature to design later; leaving it off keeps it as just a Mission.md 'Need to Revisit' note for now.","toggled":false}],"graphicsSuggestions":[{"id":"example-graphicsug-1","label":"Example graphic suggestion","detail":"Toggle this (optionally adding detail here), or describe your own graphic in the box below, then paste the trigger phrase to have Claude generate and add it to the gallery.","toggled":false}],"graphicsCustomText":"","graphics":[],"thoughts":[{"id":"one","file":"Thoughts/ThoughtOne.md","text":"A village that had forgotten how to build bridges discovered that if enough people simply stood in the shallow part of the river, each holding the hand of whoever waded in next, the crossing made itself out of nothing but willingness, and afterward nobody could say which of them had been the bridge \u2014 only that the far bank had quietly stopped being far.","newDreamRequested":false},{"id":"two","file":"Thoughts/ThoughtTwo.md","text":"A clockmaker discovers that one gear in an old town clock has been quietly running backward for decades, and instead of fixing it she builds the rest of the mechanism around its rebellion, so that once a year, for exactly one minute, the whole square hears time tick the wrong way and everyone standing there remembers something they had forgotten to forgive.","newDreamRequested":false},{"id":"three","file":"Thoughts/ThoughtThree.md","text":"A cartographer mapping a river notices the water keeps redrawing its own banks faster than her ink can dry, so she stops trying to pin down where it is and starts mapping where it wants to go instead, and the resulting chart, useless for sailing, becomes the only map anyone in the valley trusts to find water during a drought.","newDreamRequested":false}]}</script>

    return '<div class="option-card' + (g.toggled ? ' is-toggled' : '') + '" data-suggestion-id="' + esc(g.id) + '">' +
      '<button type="button" class="option-toggle" data-toggle-suggestion="' + esc(g.id) + '">' +
        '<span class="option-dot"></span><span class="option-label">' + esc(g.label) + '</span>' +
      '</button>' +
      '<textarea class="suggestion-detail" placeholder="Add specifics (optional)..." data-suggestion-detail="' + esc(g.id) + '">' + esc(g.detail || '') + '</textarea>' +
      '</div>';
  }

  function renderGraphicItem(item){
    return '<div class="graphic-card" data-graphic-id="' + esc(item.id) + '">' +
      '<div class="graphic-media">' + (item.svg || '') + '</div>' +
      '<div class="graphic-meta">' +
        '<span class="graphic-title">' + esc(item.title) + '</span>' +
        '<button type="button" class="note-del" data-del-graphic="' + esc(item.id) + '">Remove</button>' +
      '</div>' +
      (item.note ? '<p class="graphic-note">' + esc(item.note) + '</p>' : '') +
      '</div>';
  }

  function renderGraphicsSection(state){
    var suggestions = state.graphicsSuggestions.length ? state.graphicsSuggestions.map(renderGraphicSuggestion).join('') : '';
    var gallery = state.graphics.length
      ? state.graphics.map(renderGraphicItem).join('')
      : '<p class="settings-empty">No graphics yet — toggle a suggestion above (or describe your own), then paste the trigger phrase below.</p>';
    return '<section class="wide-section">' +
      '<h2>Graphics</h2>' +
      '<div class="option-grid" id="graphics-suggestions">' + suggestions + '</div>' +
      '<div class="add-row graphics-custom-row">' +
        '<input type="text" id="graphics-custom-input" placeholder="Describe a graphic you want...">' +
        '<button type="button" id="graphics-custom-btn">Request</button>' +
      '</div>' +
      '<div class="graphics-gallery" id="graphics-gallery">' + gallery + '</div>' +
      '</section>';
  }

  function renderThoughtCard(thought){
    return '<button type="button" class="cloud-card" data-open-thought="' + esc(thought.id) + '">' +
      '<svg class="cloud-svg" viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet"><use href="#cloud-shape"></use></svg>' +
      '<span class="cloud-preview">' + truncate(thought.text, 46) + '</span>' +
      '</button>';
  }

  function renderThoughtsSection(state){
    return '<section class="thoughts-section">' +
      '<h2>Thoughts</h2>' +
      '<div class="thoughts-grid">' + state.thoughts.map(renderThoughtCard).join('') + '</div>' +
      '</section>';
  }

  function renderModal(uiState, state){
    if(!uiState.openThoughtId) return '';
    var thought = state.thoughts.filter(function(t){ return t.id === uiState.openThoughtId; })[0];
    if(!thought) return '';
    var requested = !!thought.newDreamRequested;
    return '<div class="thought-modal-backdrop" id="thought-modal-backdrop">' +
      '<div class="thought-modal">' +
        '<svg class="cloud-svg" viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet"><use href="#cloud-shape"></use></svg>' +
        '<button type="button" class="modal-close" id="thought-modal-close" aria-label="Close">&times;</button>' +
        '<div class="thought-modal-content">' +
          '<div class="thought-modal-text">' + esc(thought.text) + '</div>' +
          '<div class="thought-modal-footer">' +
            '<span class="thought-modal-file">' + esc(thought.file) + '</span>' +
            '<button type="button" class="new-dream-btn' + (requested ? ' requested' : '') + '" data-new-dream="' + esc(thought.id) + '">' +
              (requested ? 'New dream requested ✓' : 'Request new dream') +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderSetting(setting){
    if(setting.type === 'toggle'){
      return '<div class="setting-row" data-setting-id="' + esc(setting.id) + '">' +
        '<span class="setting-label">' + esc(setting.label) + '</span>' +
        '<input type="checkbox" data-setting-toggle="' + esc(setting.id) + '"' + (setting.value ? ' checked' : '') + '>' +
        '</div>';
    }
    return '';
  }

  function renderBody(state){
    var branch = (window.__DASHBOARD_BRANCH__ || 'unknown');
    var notesHtml = state.notes.map(renderNote).join('');
    var settingsHtml = state.settings.length
      ? state.settings.map(renderSetting).join('')
      : '<p class="settings-empty">No settings yet — ask Claude to add a toggle or option here whenever you want one.</p>';
    return (
      SVG_DEFS +
      '<header>' +
        '<div class="eyebrow">agentic-claude <span class="branch-pill">branch: ' + esc(branch) + '</span></div>' +
        '<h1>Project Dashboard</h1>' +
        '<p>A persistent planning board and settings panel. Add notes, and ask Claude to add toggles here over time — this page grows by request and is never rewritten wholesale.</p>' +
        '<div class="status" id="save-status"></div>' +
      '</header>' +
      renderMissionSection(state) +
      '<main>' +
        '<section>' +
          '<h2>Planning Board</h2>' +
          '<div class="board" id="board">' + notesHtml + '</div>' +
          '<div class="add-row">' +
            '<input type="text" id="new-note-input" placeholder="Add a planning note...">' +
            '<button type="button" id="add-note-btn">Add</button>' +
          '</div>' +
        '</section>' +
        '<section>' +
          '<h2>Settings</h2>' +
          '<div class="settings-panel" id="settings">' + settingsHtml + '</div>' +
        '</section>' +
      '</main>' +
      renderFeatureListSection(state) +
      renderQuickOptionsSection(state) +
      renderGraphicsSection(state) +
      renderThoughtsSection(state) +
      '<div class="copy-footer">' +
        '<span class="copy-label">Paste this to trigger Claude</span>' +
        '<div class="copy-row">' +
          '<code class="copy-text" id="copy-text">check dashboard data and continue accordingly</code>' +
          '<button type="button" class="copy-btn" id="copy-btn">Copy</button>' +
        '</div>' +
      '</div>'
    );
  }

  function buildFullHtml(state){
    var bodyHtml = renderBody(state);
    var dataScript = '<script id="dashboard-data" type="application/json">' +
      JSON.stringify(state).replace(/</g, '\\u003c') + '<' + '/script>';
    var logicEl = document.getElementById('dashboard-logic');
    var logicScript = logicEl ? logicEl.outerHTML : '';
    return '<!doctype html>\n<html><head>' + HEAD_EXTRA + '<title>' + TITLE + '</title><style>' + CSS + '</style></head><body>' +
      '<div id="app">' + bodyHtml + '</div>' + dataScript + logicScript + '</body></html>';
  }

  var state = JSON.parse(document.getElementById('dashboard-data').textContent);
  var uiState = { openThoughtId: null };
  var artifactCapPromise = null;
  function getArtifact(){
    if(!window.claude || !window.claude.use) return Promise.resolve(null);
    if(!artifactCapPromise) artifactCapPromise = window.claude.use('artifact');
    return artifactCapPromise;
  }

  var saveTimer = null;
  function setStatus(text){
    var el = document.getElementById('save-status');
    if(el) el.textContent = text;
  }

  function persistLocalFallback(){
    try{ localStorage.setItem('dashboard-state-fallback', JSON.stringify(state)); }catch(e){}
  }

  function scheduleSave(){
    setStatus('Saving…');
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 800);
  }

  function doSave(){
    persistLocalFallback();
    getArtifact().then(function(cap){
      if(!cap){
        setStatus('Not saved — open this as your Claude Artifact to persist changes.');
        return;
      }
      cap.publish(buildFullHtml(state)).then(function(){
        setStatus('Saved.');
      }).catch(function(err){
        if(err && err.code === 'conflict') return;
        console.error('dashboard save failed', err);
        setStatus('Save failed — see console.');
      });
    });
  }

  function render(){
    var styleEl = document.getElementById('dashboard-style');
    if(!styleEl){
      styleEl = document.createElement('style');
      styleEl.id = 'dashboard-style';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = CSS;
    document.title = TITLE;
    document.getElementById('app').innerHTML = renderBody(state) + renderModal(uiState, state);
    attachHandlers();
  }

  function attachHandlers(){
    var missionText = document.getElementById('mission-text');
    if(missionText){
      missionText.addEventListener('blur', function(){
        var text = missionText.textContent;
        if(text !== state.missionStatement){
          state.missionStatement = text;
          scheduleSave();
        }
      });
    }
    var addBtn = document.getElementById('add-note-btn');
    var input = document.getElementById('new-note-input');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var text = (input.value || '').trim();
        if(!text) return;
        state.notes.push({ id: 'n' + Date.now() + Math.random().toString(36).slice(2,7), text: text });
        input.value = '';
        render();
        scheduleSave();
      });
    }
    if(input){
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter') addBtn.click();
      });
    }
    var board = document.getElementById('board');
    if(board){
      board.addEventListener('click', function(e){
        var delBtn = e.target.closest('[data-del-note]');
        if(delBtn){
          var id = delBtn.getAttribute('data-del-note');
          state.notes = state.notes.filter(function(n){ return n.id !== id; });
          render();
          scheduleSave();
        }
      });
      board.addEventListener('blur', function(e){
        var textEl = e.target.closest('[data-note-field="text"]');
        if(!textEl) return;
        var noteEl = textEl.closest('[data-note-id]');
        var id = noteEl.getAttribute('data-note-id');
        var note = state.notes.filter(function(n){ return n.id === id; })[0];
        if(note){
          note.text = textEl.textContent;
          scheduleSave();
        }
      }, true);
    }
    var settings = document.getElementById('settings');
    if(settings){
      settings.addEventListener('change', function(e){
        var toggle = e.target.closest('[data-setting-toggle]');
        if(!toggle) return;
        var id = toggle.getAttribute('data-setting-toggle');
        var setting = state.settings.filter(function(s){ return s.id === id; })[0];
        if(setting){
          setting.value = toggle.checked;
          scheduleSave();
        }
      });
    }
    var featureList = document.getElementById('feature-list');
    if(featureList){
      featureList.addEventListener('click', function(e){
        var btn = e.target.closest('[data-toggle-feature]');
        if(!btn) return;
        var id = btn.getAttribute('data-toggle-feature');
        var f = state.features.filter(function(x){ return x.id === id; })[0];
        if(f){
          f.picked = !f.picked;
          render();
          scheduleSave();
        }
      });
    }
    var quickOptions = document.getElementById('quick-options');
    if(quickOptions){
      quickOptions.addEventListener('click', function(e){
        var btn = e.target.closest('[data-toggle-option]');
        if(!btn) return;
        var id = btn.getAttribute('data-toggle-option');
        var o = state.quickOptions.filter(function(x){ return x.id === id; })[0];
        if(o){
          o.toggled = !o.toggled;
          render();
          scheduleSave();
        }
      });
    }
    var graphicsSuggestions = document.getElementById('graphics-suggestions');
    if(graphicsSuggestions){
      graphicsSuggestions.addEventListener('click', function(e){
        var btn = e.target.closest('[data-toggle-suggestion]');
        if(!btn) return;
        var id = btn.getAttribute('data-toggle-suggestion');
        var g = state.graphicsSuggestions.filter(function(x){ return x.id === id; })[0];
        if(g){
          g.toggled = !g.toggled;
          render();
          scheduleSave();
        }
      });
      graphicsSuggestions.addEventListener('blur', function(e){
        var ta = e.target.closest('[data-suggestion-detail]');
        if(!ta) return;
        var id = ta.getAttribute('data-suggestion-detail');
        var g = state.graphicsSuggestions.filter(function(x){ return x.id === id; })[0];
        if(g){
          g.detail = ta.value;
          scheduleSave();
        }
      }, true);
    }
    var graphicsCustomBtn = document.getElementById('graphics-custom-btn');
    var graphicsCustomInput = document.getElementById('graphics-custom-input');
    if(graphicsCustomBtn && graphicsCustomInput){
      graphicsCustomBtn.addEventListener('click', function(){
        var text = (graphicsCustomInput.value || '').trim();
        if(!text) return;
        state.graphicsSuggestions.push({
          id: 'g' + Date.now() + Math.random().toString(36).slice(2,7),
          label: 'Custom request',
          detail: text,
          toggled: true,
          custom: true
        });
        graphicsCustomInput.value = '';
        render();
        scheduleSave();
      });
      graphicsCustomInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter') graphicsCustomBtn.click();
      });
    }
    var graphicsGallery = document.getElementById('graphics-gallery');
    if(graphicsGallery){
      graphicsGallery.addEventListener('click', function(e){
        var delBtn = e.target.closest('[data-del-graphic]');
        if(!delBtn) return;
        var id = delBtn.getAttribute('data-del-graphic');
        state.graphics = state.graphics.filter(function(x){ return x.id !== id; });
        render();
        scheduleSave();
      });
    }
    var thoughtsGrid = document.querySelector('.thoughts-grid');
    if(thoughtsGrid){
      thoughtsGrid.addEventListener('click', function(e){
        var card = e.target.closest('[data-open-thought]');
        if(!card) return;
        uiState.openThoughtId = card.getAttribute('data-open-thought');
        render();
      });
    }
    var backdrop = document.getElementById('thought-modal-backdrop');
    if(backdrop){
      backdrop.addEventListener('click', function(e){
        if(e.target === backdrop){
          uiState.openThoughtId = null;
          render();
        }
      });
      var closeBtn = document.getElementById('thought-modal-close');
      if(closeBtn){
        closeBtn.addEventListener('click', function(){
          uiState.openThoughtId = null;
          render();
        });
      }
      var newDreamBtn = backdrop.querySelector('[data-new-dream]');
      if(newDreamBtn){
        newDreamBtn.addEventListener('click', function(){
          var id = newDreamBtn.getAttribute('data-new-dream');
          var thought = state.thoughts.filter(function(t){ return t.id === id; })[0];
          if(thought){
            thought.newDreamRequested = !thought.newDreamRequested;
            render();
            scheduleSave();
          }
        });
      }
    }
    var copyBtn = document.getElementById('copy-btn');
    if(copyBtn){
      copyBtn.addEventListener('click', function(){
        var text = document.getElementById('copy-text').textContent;
        copyToClipboard(text).then(function(ok){
          copyBtn.textContent = ok ? 'Copied!' : 'Select & copy manually';
          setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1600);
        });
      });
    }
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ return true; }).catch(function(){ return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && uiState.openThoughtId){
      uiState.openThoughtId = null;
      render();
    }
  });

  render();
})();
</script>
