{% extends "base.html" %}

{% block title %}Log in — Connecting Human Needs{% endblock %}

{% block content %}
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form class="compose-form" method="post" action="{{ url_for('login') }}">
    <label for="key">Account key</label>
    <input type="text" id="key" name="key" required maxlength="120" autocomplete="off">
    <button type="submit">Log in</button>
  </form>
  <p class="placeholder">No account yet? <a href="{{ url_for('signup') }}">Sign up</a>.</p>
{% endblock %}
