<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Connecting Human Needs{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">Connecting Human Needs</a>
    <span class="auth-status">
      {% if current_user %}
        logged in as <strong>{{ current_user.username }}</strong>
        <a href="{{ url_for('notes') }}">My notes</a>
        <form class="logout-form" method="post" action="{{ url_for('logout') }}">
          <button type="submit" class="link-button">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('signup') }}">Sign up</a>
        <a href="{{ url_for('login') }}">Log in</a>
      {% endif %}
    </span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
