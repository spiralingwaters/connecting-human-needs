{% extends "base.html" %}

{% block title %}Connecting Human Needs — Global Stream{% endblock %}

{% block content %}
  <p class="tagline">{{ tagline }}</p>
  <form class="search-form" method="get" action="{{ url_for('search') }}">
    <input type="text" name="q" placeholder="Search the stream&hellip;" maxlength="200">
    <button type="submit">Search</button>
  </form>
  <a class="compose-link" href="{{ url_for('new_post') }}">New post</a>
  <div class="stream">
    {% for post in posts %}
      <article class="post">
        <div class="post-meta">{{ post.author_name }} &middot; {{ post.created_at }}</div>
        <div class="post-body">{{ post.body }}</div>
      </article>
    {% else %}
      <p class="placeholder">No posts yet.</p>
    {% endfor %}
  </div>
{% endblock %}
